<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Surf Fuerteventura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an Atlantic "hero" band with drifting swell lines answers "where and when today" (the best bet, then
   cards per coast that overlap its lower edge); then a 3-day heatmap grouped by coast, a sticky two-level switcher
   (coast, then spot), and per spot: key facts, one shared legend, a card per day
   (when to go → tide/daylight strip → surf table), and finally the spot guide. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#13222B; --muted:#5B6D74; --line:#D8E1E0;
  --sea:#0C6C76; --sea-tint:#DBEEEE; --land:#EAD7AE; --coast:#A9732B; --wind:#1C8455;
  --hero-1:#082636; --hero-2:#0E4A5E; --hero-ink:#F1F8F8; --hero-muted:#A4C3C9; --hero-hi:#7FD6D8; --hero-lo:#E8C27E;
  --tab-on-bg:#0B2F42; --tab-on-fg:#F1F8F8;
  --night:rgba(8,38,54,.17); --twilight:rgba(8,38,54,.07);
  --great-bg:#1C8455; --great-fg:#FFFFFF; --ok-bg:#F2C14E; --ok-fg:#2C2105; --poor-bg:#E0E7E6; --poor-fg:#4A5A60; --poor-bar:#AEBDBF; --dark-bg:#2A3B44; --dark-fg:#DCE6E9;
  --good:#1C8455; --warn:#8E5F00; --bad:#B4443A;
  --good-tint:#DDF1E6; --warn-tint:#FBF0D2; --bad-tint:#F8E1DE;
  --shadow:0 1px 2px rgba(8,38,54,.06),0 10px 28px rgba(8,38,54,.08);
  --display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A141A; --surface:#101E26; --surface-2:#0D1920; --ink:#E5EEF0; --muted:#93A7AE; --line:#21343D;
  --sea:#4FC4C6; --sea-tint:#11303A; --land:#433728; --coast:#D2A45E; --wind:#4BC489;
  --hero-1:#051A25; --hero-2:#0A3646; --hero-ink:#EAF4F5; --hero-muted:#8FB1B8;
  --tab-on-bg:#4FC4C6; --tab-on-fg:#04161D;
  --night:rgba(0,0,0,.45); --twilight:rgba(0,0,0,.22);
  --great-bg:#35B377; --great-fg:#03200F; --ok-bg:#E6B347; --ok-fg:#231800; --poor-bg:#22323A; --poor-fg:#A6B6BB; --poor-bar:#3E5058; --dark-bg:#060D11; --dark-fg:#7F9298;
  --good:#4BC489; --warn:#E6B347; --bad:#EE8072;
  --good-tint:#123227; --warn-tint:#33290F; --bad-tint:#3A1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A141A; --surface:#101E26; --surface-2:#0D1920; --ink:#E5EEF0; --muted:#93A7AE; --line:#21343D;
  --sea:#4FC4C6; --sea-tint:#11303A; --land:#433728; --coast:#D2A45E; --wind:#4BC489;
  --hero-1:#051A25; --hero-2:#0A3646; --hero-ink:#EAF4F5; --hero-muted:#8FB1B8;
  --tab-on-bg:#4FC4C6; --tab-on-fg:#04161D;
  --night:rgba(0,0,0,.45); --twilight:rgba(0,0,0,.22);
  --great-bg:#35B377; --great-fg:#03200F; --ok-bg:#E6B347; --ok-fg:#231800; --poor-bg:#22323A; --poor-fg:#A6B6BB; --poor-bar:#3E5058; --dark-bg:#060D11; --dark-fg:#7F9298;
  --good:#4BC489; --warn:#E6B347; --bad:#EE8072;
  --good-tint:#123227; --warn-tint:#33290F; --bad-tint:#3A1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{margin:0;font-family:var(--display);text-wrap:balance}
p{margin:0}
a{color:var(--sea)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.ic{width:15px;height:15px;flex:none;vertical-align:-2px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;color:var(--hero-ink);background:radial-gradient(130% 150% at 88% -20%,var(--hero-2) 0%,var(--hero-1) 62%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;max-width:980px;margin:0 auto;padding-block:30px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--hero-muted)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
/* Language switch: two small segments on the hero */
.lang{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);flex:none}
.lang button{all:unset;box-sizing:border-box;cursor:pointer;min-width:40px;padding:6px 10px;border-radius:999px;text-align:center;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.12em;line-height:1.2;color:var(--hero-muted);transition:background .15s ease,color .15s ease}
.lang button:hover{color:var(--hero-ink)}
.lang button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero-1)}
.lang button:focus-visible{outline:2px solid var(--hero-ink);outline-offset:2px}
.hero h1{font-weight:900;font-size:clamp(3.1rem,11vw,5.6rem);line-height:.84;text-transform:uppercase;letter-spacing:.005em}
.hero-spots{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted);margin-top:6px}
.hero .meta{font-family:var(--mono);font-size:.74rem;color:var(--hero-muted);margin-top:8px;max-width:72ch}
.nw{white-space:nowrap}
.stale{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--ok-bg);color:var(--ok-fg);font-weight:600;max-width:60ch}
.hero-h{margin-top:22px;font-weight:800;font-size:1.45rem;letter-spacing:.06em;text-transform:uppercase}
/* Today's tides: the first thing in the hero */
.htide{margin-top:18px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.htide-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.htide-h{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.htide-now{font-size:.92rem;font-weight:600;color:var(--hero-ink)}
.htide-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border:1px solid rgba(255,255,255,.18);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.07)}
.htc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;min-width:0;text-align:center}
.htc+.htc{border-left:1px solid rgba(255,255,255,.14)}
.htc .tk{color:var(--hero-muted)}
.htc.hi .tri{color:var(--hero-hi)}
.htc.lo .tri{color:var(--hero-lo)}
.htc b{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,6vw,1.9rem);line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.htc small{font-family:var(--mono);font-size:.72rem;color:var(--hero-muted)}
.htc.past{opacity:.45}
.htc.next{background:rgba(255,255,255,.12);box-shadow:inset 0 -3px 0 var(--hero-ink)}
.htide-f{font-size:.74rem;color:var(--hero-muted)}
.pick{margin-top:12px}
.pickbtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:12px;max-width:100%;padding:10px 16px 10px 10px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:var(--hero-ink);transition:background .15s ease}
.pickbtn:hover{background:rgba(255,255,255,.12)}
.pickbtn:focus-visible{outline:2px solid var(--hero-ink);outline-offset:2px}
.pickbtn .score{font-size:1.7rem;border-radius:12px;flex:none}
.pick-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick-l{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted)}
.pick-m{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.05;letter-spacing:.01em}
.pick-m b{font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.pick-m .num{font-family:var(--display);white-space:nowrap}
.pick-s{font-size:.78rem;color:var(--hero-muted)}
.pick-go{font-size:1.4rem;line-height:1;color:var(--hero-muted);margin-left:2px;flex:none}

/* ---------- Page ---------- */
.wrap{max-width:980px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.sect-h{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line)}
.lk{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}

/* Score badge */
.score{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:2em;padding:0 .35em;border-radius:10px;font-family:var(--display);font-weight:900;font-size:1.3rem;line-height:1}
.score.great{background:var(--great-bg);color:var(--great-fg)}
.score.ok{background:var(--ok-bg);color:var(--ok-fg)}
.score.poor{background:var(--poor-bg);color:var(--poor-fg)}
.score.dark{background:var(--dark-bg);color:var(--dark-fg)}
.score.sm{font-size:1.05rem;border-radius:8px}

/* ---------- Today cards ---------- */
.today{margin-top:-70px;position:relative}
.best{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 12px}
.rgroup{grid-column:span var(--n);display:flex;flex-direction:column;gap:9px;min-width:0}
.rhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;padding-left:2px}
.rname{font-weight:900;font-size:1.25rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);line-height:1}
.rsub{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted)}
.rgroup:first-child .rname{color:var(--hero-ink)}
.rgroup:first-child .rsub{color:var(--hero-muted)}
.rcards{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.bcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.bcard:hover{transform:translateY(-2px)}
.bcard:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
.bname{font-family:var(--display);font-weight:900;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.bline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bcard .score{font-size:1.9rem;border-radius:13px}
.bwhen{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1;letter-spacing:.01em}
.bverdict{font-size:.8rem;color:var(--muted);font-weight:600;flex-basis:100%;margin-top:-4px}
.brange{font-size:.86rem;font-weight:600}
.bcond{font-size:.84rem;color:var(--muted)}
.weakwhy{color:var(--ink)}
.weakwhy b{font-size:inherit;font-weight:700}
.bcmp{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px}
.bnext{display:flex;flex-direction:column;gap:2px;font-size:.88rem;background:var(--sea-tint);border-radius:12px;padding:9px 12px}
.bnext .lk{font-size:.62rem}
.bnext b{font-weight:700}

/* Comment */
.notebox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:baseline;padding:16px 20px}
.note{max-width:74ch}

/* ---------- 3-day heatmap ---------- */
.mxcard{padding:18px 20px}
.mxw{display:flex;gap:22px}
.mx{border-collapse:separate;border-spacing:4px 4px;font-family:var(--mono);font-size:.76rem}
.mx th{font-weight:500;color:var(--muted);padding:0}
.mx .dh{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--ink);text-align:left;padding-left:4px;text-transform:uppercase;letter-spacing:.04em}
.mx .th{text-align:center}
.mx .th.now{color:var(--bad);font-weight:600}
.mx .rh{text-align:left;font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--ink);padding-right:10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.mxday:not(:first-child) .rh,.mxday:not(:first-child) .corner{display:none}
.mx .rgrow th,.mx .rgrow td{height:26px;padding:10px 0 0;vertical-align:bottom}
.mx tbody:first-of-type .rgrow th,.mx tbody:first-of-type .rgrow td{height:18px;padding-top:2px}
.mx th.rgh{font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
.mc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;font-weight:600;font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums;transition:transform .12s ease}
.mc:hover{transform:scale(1.08)}
.mc.great{background:var(--great-bg);color:var(--great-fg)}
.mc.ok{background:var(--ok-bg);color:var(--ok-fg)}
.mc.poor{background:var(--poor-bg);color:var(--poor-fg)}
.mc.dark,.hatch{background:repeating-linear-gradient(135deg,var(--dark-bg) 0 2px,var(--night) 2px 6px)}
.mc.past{opacity:.38}
.mc.none{cursor:default;border:1px dashed var(--line)}
.mx td.now .mc{box-shadow:0 0 0 2px var(--bad)}
.mc:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.78rem;color:var(--muted);margin-top:12px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{display:inline-block;width:13px;height:13px;border-radius:4px;background:var(--c)}
.keys i.hatch{background:repeating-linear-gradient(135deg,var(--dark-bg) 0 2px,var(--night) 2px 6px)}

/* ---------- Spot switcher ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-direction:column;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.rtabs,.stabs{display:flex;gap:4px;min-width:0}
.rtabs button{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 8px;border-radius:999px;font-family:var(--mono);font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rtabs button[aria-selected="true"]{background:var(--sea-tint);color:var(--sea)}
.rtabs .cnt{font-size:.62rem;letter-spacing:0;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.rtabs button[aria-selected="true"] .cnt{border-color:var(--sea);color:var(--sea)}
.stabs button{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 0;min-width:0;text-align:center;padding:10px 6px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);line-height:1.05}
.stabs button[aria-selected="true"]{background:var(--tab-on-bg);color:var(--tab-on-fg)}
.tabs button:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
@media (min-width:721px){
  .tabs{flex-direction:row;align-items:center;border-radius:999px}
  .rtabs{flex:0 0 auto;padding-right:6px;border-right:1px solid var(--line)}
  .rtabs button{flex:0 0 auto;padding:10px 12px}
  .stabs{flex:1}
}

/* ---------- Spot panel ---------- */
#panel{display:flex;flex-direction:column;gap:22px}
.spothead{display:flex;flex-direction:column;gap:12px}
.spothead h2{font-weight:900;font-size:clamp(2.4rem,8vw,3.6rem);line-height:.88;text-transform:uppercase}
.spot-eyebrow{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);margin-bottom:-4px}
.chips,.links{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--sea-tint);color:var(--sea)}
.links a{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;background:var(--surface);color:var(--ink)}
.links a:hover{border-color:var(--sea);color:var(--sea)}
.ideal{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ideal>div{display:flex;flex-direction:column;gap:4px;padding:14px 16px;min-width:0;background:var(--surface)}
.ideal .iw{grid-row:span 3;gap:8px}
.ideal>div>b{font-weight:600;font-size:.92rem}
.itbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
.itbl th,.itbl td{padding:8px 10px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.itbl thead th,.itbl thead td{border-top:0;padding:6px 10px}
.itbl tbody th{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap;padding-left:0;width:1%}
.itbl td b{display:block;font-family:var(--mono);font-weight:600;font-size:.98rem;line-height:1.3}
.itbl td small{display:block;font-size:.74rem;color:var(--muted);margin-top:1px}
.itbl .on{background:var(--sea-tint)}
.itbl thead .on{border-radius:10px 10px 0 0}
.itbl tbody tr:last-child .on{border-radius:0 0 10px 10px}
.itbl td.na{color:var(--muted);font-style:italic}
.itbl .pkrow th,.itbl .pkrow td{padding:12px 10px 2px 0}
.itbl .pkrow th{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.itbl tbody .pkrow:first-child th,.itbl tbody .pkrow:first-child td{padding-top:4px;border-top:0}
.itbl tr.pkrow+tr th,.itbl tr.pkrow+tr td{border-top:0}
.itbl thead th{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.itbl thead th.on{color:var(--sea)}

/* Shared legend */
.legend{padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.8rem;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:20px;height:5px;border-radius:3px;background:var(--c);flex:none}
.sw.bar{width:30px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--poor-bar) 0 33%,var(--ok-bg) 33% 66%,var(--great-bg) 66%)}
.sw.outline{width:20px;height:9px;background:transparent;border:2px solid var(--ink);border-radius:2px}
.sw.shade{width:16px;height:12px;border-radius:3px;background:var(--night)}
.sw.nowl{width:2px;height:13px;border-radius:1px;background:var(--bad)}
.sw.ws{width:14px;height:12px;border-radius:3px}

    <p><b>Úroveň.</b> Hodnocení, okna i doporučení počítá stránka pro středně pokročilé, tedy pro vlny zhruba do 1 m: ideál je do 1 m, nad 1 m skóre rychle klesá a nad 1,2 m jsou vlny moc velké. Při dlouhé periodě (13 s a víc) má i metrová vlna víc síly, proto stránka hlídá i energii v kJ. U každého spotu je v přehledu nahoře zvlášť ideální výška a síla vln pro začátečníky a pro středně pokročilé. Rozsahy jsou můj odhad podle typu spotu a zdrojů a vztahují se k číslům z předpovědi pro daný bod, u východu tedy k menším číslům z chráněného Bajo el Medio. Skóre ukazuje, jak podmínky sedí středně pokročilým, ne absolutní kvalitu vln jako hvězdičky na surf-forecast.com.</p>
    <p><b>Příliv a odliv.</b> Cyklus má čtyři části, každá trvá zhruba 3 hodiny: low → mid a mid → high, kdy voda stoupá (příliv, ↗), a high → mid a mid → low, kdy klesá (odliv, ↘). Mid je polovina výšky mezi odlivem a přílivem. „Mid → high a high → mid“ tedy znamená zhruba 3 hodiny před a 3 hodiny po vrcholu přílivu (▲). Přílivy jsou pro Corralejo (sever a východ) a pro Cotillo (západ), liší se nejvýš o pár minut. Časy přílivu se každý den posouvají nepravidelně: kolem první a poslední čtvrti Měsíce i o 1,5–2 hodiny, kolem úplňku a novu jen asi o půl hodiny. Průměr je zhruba 50 minut za den.</p>

    <p><b>Vítr.</b> Stav větru je „wind state“ ze surf-forecast.com: u Majanicha, Rocky Point a Playa de Esquinzo ho stránka přebírá přímo odtud, protože ho surf-forecast počítá z přesného směru a síly větru. U ostatních spotů ho dopočítá ze směru větru vůči natočení pláže a bezvětří vezme z nejbližšího bodu surf-forecastu. Od břehu (offshore) fouká z pevniny na moře a vlnu uhlazuje. Ke břehu (onshore) fouká z moře na pevninu a vlnu rozbije. Boční fouká podél pobřeží, boční od břehu a boční ke břehu jsou mezi tím. Při bezvětří je voda hladká. Šipky ukazují, kam vítr nebo swell míří.</p>

      footer: `<p><b>How to read the scores.</b> Swell, energy, period and wind come from surf-forecast.com, every 3 hours for 3 days. The north uses the Majanicho forecast point (Punta Blanca and La Caleta lie 1–7 km from it), the east uses Bajo el Medio, surf-forecast's name for Rocky Point (Dunas beach is 2 km south), and the west uses Playa de Esquinzo. The page scores each spot from 0 to 10 on its own, from wave height, period, energy, swell direction, the wind against the way the coast faces, and the tide. For Majanicho and Rocky Point it scores only the Inside; the Outside needs a bigger swell and its waves are usually over 1 m. Times in the dark are not scored. It's a guide, not a verdict.</p>
    <p><b>Level.</b> Scores, windows and recommendations are for intermediate surfers, meaning waves up to about 1 m: the ideal is up to 1 m, above 1 m the score drops quickly and above 1.2 m the waves are too big. With a long period (13 s or more) even a 1 m wave carries more power, so the page also watches the energy in kJ. Each spot's overview lists the ideal wave height and energy separately for beginners and intermediates. The ranges are my estimates from the spot type and sources, and they refer to the numbers in that point's forecast, so for the east to the smaller numbers from sheltered Bajo el Medio. The score shows how well the conditions suit intermediates, not the absolute wave quality like the stars on surf-forecast.com.</p>
    <p><b>Tides.</b> The cycle has four parts of about 3 hours each: low → mid and mid → high while the water rises (↗), and high → mid and mid → low while it falls (↘). Mid is halfway between low and high water. So “mid → high and high → mid” means roughly 3 hours before and 3 hours after high tide (▲). Tides are for Corralejo (north and east) and Cotillo (west); they differ by a few minutes at most. Tide times shift irregularly from day to day: around the Moon's first and last quarter by up to 1.5–2 hours, around full and new moon by only about half an hour. On average it's roughly 50 minutes a day.</p>
    <p><b>When to go.</b> The page works out windows every 10 minutes between first light and dark. It takes the tide exactly and interpolates wind and swell between the 3-hourly forecast points (hence ≈). The best part of a window stays within one point of its peak; the longer “rideable” stretch stays at 3/10 or more. When nothing reaches 3/10, the page shows the best time of the day and why it's weak.</p>
    <p><b>Wind.</b> The wind state is surf-forecast.com's: for Majanicho, Rocky Point and Playa de Esquinzo the page takes it straight from there, because surf-forecast works it out from the exact wind direction and speed. For the other spots the page works it out from the wind direction against the way the beach faces, and takes glassy from the nearest surf-forecast point. Offshore wind blows from the land out to sea and grooms the waves. Onshore wind blows from the sea onto the land and breaks them up. Cross-shore wind blows along the coast; cross-off and cross-on are in between. With no wind (glassy) the water is smooth. Arrows show where the wind or swell is heading.</p>

const ICON_SWELL = `<svg viewBox="0 0 28 18" aria-hidden="true"><path d="M3 16a11 11 0 0 1 22 0M8 16a6 6 0 0 1 12 0" fill="none" stroke="var(--sea)" stroke-width="2.4" stroke-linecap="round"/></svg>`;

// ---------- Site diagram: sea, land, ideal swell crests, ideal (offshore) wind, forecast wind ----------
function P(cx, cy, b, R) { const a = b * Math.PI / 180; return [cx + R * Math.sin(a), cy - R * Math.cos(a)]; }
const pt = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
const sectorWidth = (a, b) => ((b - a) % 360 + 360) % 360;
function diagram(spot, focus) {
  const g = GUIDE[spot.id], cx = 150, cy = 150, r = 112, f = spot.face;
  const u = P(0, 0, f + 90, 1), n = P(0, 0, f, 1); const coast = [];
  for (let i = 0; i <= 40; i++) {

  }
  const coastD = "M" + coast.map(pt).join("L");

  const swellFan = `<path d="M${pt(P(cx, cy, s1, r))}A${r} ${r} 0 ${sw > 180 ? 1 : 0} 1 ${pt(P(cx, cy, s2, r))}L${cx} ${cy}Z" fill="var(--sea)" opacity=".12"/>`;
  const [w1, w2] = g.windSector, ww = sectorWidth(w1, w2), wc = w1 + ww / 2;
  const windFan = `<path d="M${pt(P(cx, cy, w1, r))}A${r} ${r} 0 ${ww > 180 ? 1 : 0} 1 ${pt(P(cx, cy, w2, r))}L${cx} ${cy}Z" fill="var(--wind)" opacity=".13"/>`;
  const lat = P(0, 0, wc + 90, 1);

    const a = P(cx, cy, wc, r * 0.8), b = P(cx, cy, wc + 180, r * 0.22);
    return `<line x1="${(a[0] + o * lat[0]).toFixed(1)}" y1="${(a[1] + o * lat[1]).toFixed(1)}" x2="${(b[0] + o * lat[0]).toFixed(1)}" y2="${(b[1] + o * lat[1]).toFixed(1)}" stroke="var(--wind)" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-wind-${spot.id})"/>`;
  }).join("");

    now = `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="var(--ink)" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#ah-now-${spot.id})"/>`;
  }
  const card = TX.compass.map(([l, b]) => { const p = P(cx, cy, b, r + 17); return `<text x="${p[0].toFixed(1)}" y="${(p[1] + 4.5).toFixed(1)}" text-anchor="middle" class="dg-card">${l}</text>`; }).join("");
  const nb = focus && focus.s.w > 5 ? DIRS[focus.s.wd] : NaN;
  const seaB = [f + 50, f - 50, f + 28, f - 28].reduce((a, b) => (isFinite(nb) && angDiff(b, nb) > angDiff(a, nb)) ? b : a);

  return `<svg class="dg" viewBox="0 0 300 300" role="img" aria-label="${esc(TX.dgAria(spot.name))}">
    <defs>
      <marker id="ah-wind-${spot.id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--wind)"/></marker>
      <marker id="ah-now-${spot.id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker>
      <clipPath id="clip-${spot.id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
    </defs>
    <g clip-path="url(#clip-${spot.id})">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--sea-tint)"/>

}

// ---------- Scoring helpers (cached per render) ----------
function scored(spot) {
  const k = "s:" + spot.id; if (CACHE[k]) return CACHE[k];
  const now = Date.now(), T = tidesOf(spot);
  return CACHE[k] = slotsOf(spot).map(s => ({s, ...scoreSlot(spot, s, T, LEVEL), past: s.ms + SLOT_HALF < now}));
}
function timeline(spot, d) {
  const k = "t:" + spot.id + d; if (CACHE[k]) return CACHE[k];
  return CACHE[k] = dayScores(spot, slotsOf(spot), tidesOf(spot), d, LEVEL);
}
function windows(spot, d) {
  const k = "w:" + spot.id + d; if (CACHE[k]) return CACHE[k];
  return CACHE[k] = rideWindows(spot, slotsOf(spot), tidesOf(spot), d, 3, timeline(spot, d), LEVEL);
}
// Windows over what is left of the day only, so a window that is already running gets its best part recomputed.
function windowsFrom(spot, d, from) {
  const k = "f:" + spot.id + d + Math.floor(from / STEP); if (CACHE[k]) return CACHE[k];
  return CACHE[k] = rideWindows(spot, slotsOf(spot), tidesOf(spot), d, 3, timeline(spot, d).filter(x => x.ms > from - STEP), LEVEL);
}
const spotDays = sp => [...new Set(slotsOf(sp).map(s => s.d))];
const dataDays = () => [...new Set(allSlots().map(s => s.d))].sort();
const visDays = () => dataDays().filter(d => d >= todayLocal()); // days already over are not shown
function focusRow(rows) { return rows.find(r => !r.past && r.v != null) || rows.filter(r => r.v != null).slice(-1)[0] || null; }

function rangeText(a, b) { const now = Date.now(); return (a <= now && now < b ? TX.now : hm(a)) + "–" + hm(b); }

const WIND_FIT = {off: "good", crossoff: "good", glassy: "good", cross: "ok", crosson: "bad", on: "bad"};
function condChips(w) {
  const c = w.cond, F = w.F || {}, td = w.tide, f = k => fitCls(isFinite(F[k]) ? F[k] : 1);
  const chip = (cls, icon, text, title, sr) => `<span class="cc ${cls}"${title ? ` title="${esc(title)}"` : ""}>${icon}<span>${sr ? `<span class="sr">${esc(sr)} </span>` : ""}${esc(text)}</span></span>`;
  // Two rows: the swell itself, then wind and water. The wind chip gives speed and wind state (the compass point is
  // in its tooltip and in the table), the water chip just the phase, so the second row fits on a 360 px phone.
  const swell = [chip(f("h"), ICON_WAVE, `${fmt(c.h, 1)} m · ${Math.round(c.p)} s`, TX.tHP),
    isFinite(c.kj) ? chip(f("e"), ICON_BOLT, `${Math.round(c.kj)} kJ`, TX.tKj) : "",
    chip(f("d"), ICON_SW, TX.swellFrom(dn(degKey(c.sdDeg))))].join("");
  const glassy = w.wind.k === "glassy";
  const rest = [chip(WIND_FIT[w.wind.k] || "", ICON_WD, glassy ? TX.glassy : `${Math.round(c.w)} km/h · ${wsLabel(w.wind)}`, glassy ? TX.windSr : TX.windFrom(dn(degKey(c.wdDeg))), TX.windSr),
    td ? chip(f("t"), ICON_TIDE, phaseOf(td), TX.tideTitle, TX.tideSr) : ""].join("");

// Second opinion from another forecaster (now mondo.surf for Punta Blanca): only its good windows per day.
const QCZ = {"epic": "skvělé", "very good": "velmi dobré", "good": "dobré", "fair": "slušné", "poor": "slabé"};
const qTxt = q => { const k = String(q || "").toLowerCase(); return isEN() ? k : QCZ[k] || String(q || ""); };
function compareFor(spot) {

// ---------- Tide chart for one day: daylight, tide curve (thick = ideal water), riding windows, model points ----------
function tideChart(spot, d, rows, wins) {
  const X0 = toInstant(d, "06:00"), X1 = toInstant(d, "21:00"), W = 900, H = 90, top = 6, bot = 52;
  const TIDES = tidesOf(spot), lvl = TIDES.length ? TIDES.map(e => e.m) : [1];
  const lo = Math.min(...lvl) - 0.12, hi = Math.max(...lvl) + 0.12;
  const x = ms => (ms - X0) / (X1 - X0) * W, y = m => bot - (m - lo) / Math.max(0.5, hi - lo) * (bot - top);
  const s = sunEvents(d); let shade = "";
  shade += `<rect x="0" y="0" width="${x(s.dawn).toFixed(1)}" height="${H}" fill="var(--night)"/>`;
  shade += `<rect x="${x(s.dawn).toFixed(1)}" y="0" width="${(x(s.rise) - x(s.dawn)).toFixed(1)}" height="${H}" fill="var(--twilight)"/>`;
  shade += `<rect x="${x(s.set).toFixed(1)}" y="0" width="${(x(s.dusk) - x(s.set)).toFixed(1)}" height="${H}" fill="var(--twilight)"/>`;
  shade += `<rect x="${x(s.dusk).toFixed(1)}" y="0" width="${(W - x(s.dusk)).toFixed(1)}" height="${H}" fill="var(--night)"/>`;
  const pts = []; for (let ms = X0; ms <= X1; ms += 5 * 60000) { const td = tideAt(TIDES, ms); if (td) pts.push({ms, X: x(ms), Y: y(td.m), td}); }
  const path = P2 => P2.length ? "M" + P2.map(p => p.X.toFixed(1) + " " + p.Y.toFixed(1)).join("L") : "";
  const area = pts.length ? path(pts) + `L${pts[pts.length - 1].X.toFixed(1)} ${bot}L${pts[0].X.toFixed(1)} ${bot}Z` : "";
  // Thick segments where the tide is ideal for each peak.
  let ideal = "";
  peaksFor(spot, LEVEL).forEach((pk, i) => {
    const col = i === 0 ? "var(--sea)" : "var(--coast)"; let seg = [];
    const flush = () => { if (seg.length > 1) ideal += `<path d="${path(seg)}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`; seg = []; };
    pts.forEach(p => { if (tideFactor(pk, p.td) >= 1) seg.push(p); else flush(); }); flush();
  });
  // Score ribbon along the bottom for the whole of daylight, so it is there even on days with no window:
  // grey = weak, amber = rideable, green = worth it; solid colour = the best part of a window.
  const tl = timeline(spot, d), inCore = ms => wins.some(w => ms >= w.coreA && ms <= w.coreB);
  let bars = "", seg = null;
  const flushR = () => { if (seg) bars += `<rect x="${x(seg.a).toFixed(1)}" y="${bot + 12}" width="${Math.max(2, x(seg.b) - x(seg.a)).toFixed(1)}" height="10" fill="${seg.k === "poor" ? "var(--poor-bar)" : `var(--${seg.k}-bg)`}" opacity="${seg.op}"/>`; seg = null; };
  tl.forEach(p => {
    if (p.raw == null) { flushR(); return; }
    const k = band(Math.round(p.raw)), op = k === "poor" || inCore(p.ms) ? 1 : 0.45, end = Math.min(p.ms + STEP, s.dusk);
    if (seg && seg.k === k && seg.op === op) seg.b = end; else { flushR(); seg = {a: p.ms, b: end, k, op}; }
  });
  flushR();
  // On days where nothing reaches 3/10, outline the best stretch of the day so it is clear when to go anyway.
  const weakBest = !wins.length ? bestStretch(tl) : null;
  if (weakBest) bars += `<rect x="${x(weakBest.a).toFixed(1)}" y="${bot + 11}" width="${Math.max(6, x(weakBest.b + STEP) - x(weakBest.a)).toFixed(1)}" height="12" fill="none" stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
  // Thin dark bar at the very bottom: the other forecaster's good windows, for comparison.
  const cmp = compareFor(spot); let cmpBars = "";
  if (cmp && cmp.days.includes(d)) cmp.windows.filter(w => w.d === d).forEach(w => {
    const a = toInstant(d, w.a), b = toInstant(d, w.b);
    cmpBars += `<rect x="${x(a).toFixed(1)}" y="${bot + 28}" width="${Math.max(4, x(b) - x(a)).toFixed(1)}" height="6" rx="3" fill="var(--ink)" opacity=".75"/>`;
  });
  const nowMs = Date.now(); const nowLine = nowMs > X0 && nowMs < X1 ? `<line x1="${x(nowMs).toFixed(1)}" x2="${x(nowMs).toFixed(1)}" y1="0" y2="${H}" stroke="var(--bad)" stroke-width="2" vector-effect="non-scaling-stroke"/>` : "";
  const dots = rows.map(r => r.tide ? `<span class="tc-dot ${band(r.v)}" style="left:${(x(r.ms) / W * 100).toFixed(2)}%;top:${(y(r.tide.m) / H * 100).toFixed(2)}%" title="${esc(r.s.t)}"></span>` : "").join("");
  const ticks = [6, 9, 12, 15, 18, 21].map(h => `<span style="left:${(x(toInstant(d, pad(h) + ":00")) / W * 100).toFixed(2)}%">${h}</span>`).join("");
  return `<div class="tc"><div class="tc-plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${shade}<path d="${area}" fill="var(--sea)" opacity=".12"/><path d="${path(pts)}" fill="none" stroke="var(--muted)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${ideal}${bars}${cmpBars}${nowLine}</svg>${dots}</div><div class="tc-axis">${ticks}</div></div>`;
}

// ---------- Renderers ----------
function renderMeta() {

    n.textContent = ""; warn.hidden = true; if (nb) nb.hidden = true; return;
  }
  const upd = Date.parse(DATA.updatedAt);
  const when = isFinite(upd) ? new Date(upd).toLocaleString(TX.locale, {weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit", timeZone: TZ}).replace(/,/g, "") : "?";
  const wt = isFinite(DATA.waterTemp) ? TX.water(fmt(DATA.waterTemp), TX.wetsuit(+DATA.waterTemp)) : "";
  // Each part stays on one line, so dates never break in the middle.

function weakItem(spot, d, st) {
  const isToday = d === todayLocal(), weak = st.v < 3;
  const dayBest = isToday ? bestStretch(timeline(spot, d)) : null;
  const pastNote = dayBest && dayBest.b < Date.now() && dayBest.v > st.v ? TX.pastBest(hm(dayBest.a), hm(dayBest.b), dayBest.v) : "";
  const tags = [weak ? TX.tagWeak : bandTxt(st.v), weak ? (st.whole ? (isToday ? TX.restSimilar : TX.daySimilar) : TX.bestOfDay) : TX.tagBrief,
    spot.peaks.length > 1 ? st.peak.name : ""];
  const range = st.b < Date.now() ? `${hm(st.a)}–${hm(st.b)}` : rangeText(st.a, st.b);
  const why = weak ? `<p class="wwhy"><b>${TX.weakWhy}</b> ${esc(limiterText(st, spot))}.${pastNote ? " " + pastNote : ""}</p>` : pastNote ? `<p class="wwhy">${pastNote}</p>` : "";
  return winItem(st, {cls: "best", time: range, tags, extra: why});
}
// "Kdy jít" for one day. Today: windows that are over stay listed (dimmed), the rest is recomputed from now on.
function goBlock(spot, d) {
  const now = Date.now(), isToday = d === todayLocal(), wins = windows(spot, d);
  const done = isToday ? wins.filter(w => w.b < now) : [];
  const left = isToday ? windowsFrom(spot, d, now) : wins;
  const doneLi = done.map(w => winItem(w, {cls: "over", time: `${hm(w.coreA)}–${hm(w.coreB)}`, tags: [TX.over], chips: false})).join("");
  if (!left.length) {
    const st = stretchFor(spot, d);
    if (!st) return `<div class="go none"><span class="lk">${TX.go}</span>${doneLi ? `<ul>${doneLi}</ul>` : ""}<p>${TX.darkAlready}</p></div>`;
    return `<div class="go weak"><span class="lk">${TX.go}</span><ul>${doneLi}${weakItem(spot, d, st)}</ul></div>`;
  }
  const best = bestWindow(left), shownRun = new Set();
  return `<div class="go"><span class="lk">${TX.go}</span><ul>${doneLi}${left.map(w => {
    const first = !shownRun.has(w.runA); shownRun.add(w.runA);
    return winItem(w, {cls: w === best ? "best" : "", time: rangeText(w.coreA, w.coreB),
      tags: [w === best ? TX.tagBest : "", spot.peaks.length > 1 ? w.peak.name : ""],
      range: first && (w.runA !== w.coreA || w.runB !== w.coreB) ? runRange(w, now) : ""});
  }).join("")}</ul></div>`;
}
// Surf table for one day: times in columns (like surf-forecast.com), conditions in rows. Tap a time for "why".
function surfTable(sp, d, dr, maxV) {
  const now = Date.now(), R = TX.rows;
  const cls = r => [r.past ? "past" : "", r.v == null ? "isdark" : ""].filter(Boolean).join(" ");
  const head = dr.map(r => {
    const isNow = Math.abs(r.ms - now) <= SLOT_HALF;
    const tag = isNow ? `<span class="tag now">${TX.now}</span>` : r.light === "dark" ? `<span class="tag dark">${TX.dark}</span>` : r.light === "twilight" ? `<span class="tag tw">${TX.tw(r.ms)}</span>` : "";
    const top = r.v != null && r.v === maxV && maxV >= 3 && !r.past;
    return `<th scope="col" class="${cls(r)}"><button type="button" class="tcol${top ? " top" : ""}" data-k="${slotKey(r)}" aria-expanded="false" aria-controls="why-${dayId(d)}" title="${TX.whyTitle}"><span class="tm">${esc(r.s.t)}</span>${tag}</button></th>`;
  }).join("");
  const row = (lab, f, cellCls) => `<tr><th scope="row" class="lab">${lab}</th>${dr.map(r => `<td class="${[cellCls ? cellCls(r) : "", cls(r)].filter(Boolean).join(" ")}">${f(r)}</td>`).join("")}</tr>`;
  // Wind state like surf-forecast.com. In Czech "od břehu" / "ke břehu" never split, so long states break as "boční / od břehu";
  // in English "cross-off" / "cross-on" stay whole and only "cross-shore" breaks, the same in every column.
  const windState = r => { const t = esc(wsLabel(r.wind));
    return `<span class="wst">${isEN() ? t.replace(/^cross-(off|on)$/, `<span class="nw">cross-$1</span>`) : t.replace(/ (?=břehu)/g, "&nbsp;")}</span>`; };
  const score = r => `<span class="score sm ${band(r.v)}">${r.v == null ? "–" : r.v}</span>${sp.peaks.length > 1 && r.v != null ? `<span class="pk">${esc(r.best.peak.name)}</span>` : ""}`;
  const waves = r => `<span class="v">${fmt(r.s.h)}</span> <span class="u">m</span>`;
  const per = r => `<span class="v">${r.s.p}</span> <span class="u">s</span>`;
  const kj = r => isFinite(r.s.kj) ? `<span class="v">${r.s.kj}</span><span class="kjbar" style="--k:${Math.min(1, r.s.kj / 1000).toFixed(2)}"></span>` : "–";
  const swell = r => `<span class="cellwrap">${arrowSvg(r.s.sdDeg)}<small>${dn(r.s.sd)}</small></span>`;
  const wind = r => `<span class="cellwrap">${arrowSvg(r.s.wdDeg)}<span class="v">${r.s.w}</span><small>${dn(r.s.wd)}</small></span>`;
  const water = r => {
    const td = r.tide; if (!td) return "–";
    const tq = r.best.F.t >= 1 ? "good" : r.best.F.t >= 0.6 ? "" : "bad";
    return `<span class="cellwrap"><span class="tdir ${td.rising ? "up" : "down"}" title="${td.rising ? TX.rising : TX.falling}">${td.rising ? "↗" : "↘"}</span><span class="ph ${tq}">${phaseOf(td).replace(/ /g, "")}</span></span>`;
  };
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th class="lab" scope="col"><span class="sr">${TX.time}</span></th>${head}</tr></thead><tbody>`
    + row(R.score, score) + row(R.waves, waves, r => "fit " + fitCls(r.best.F.h)) + row(R.period, per)
    + row(R.kj, kj, r => isFinite(r.s.kj) ? "fit " + fitCls(r.best.F.e) : "") + row(R.swell, swell)
    + row(R.wind, wind) + row(R.ws, windState, r => "ws " + r.wind.k) + row(R.tide, water)
    + `</tbody></table></div><div class="why" id="why-${dayId(d)}" hidden></div>`;
}
// One legend for the whole spot, so the day cards stay clean.
function legendHtml(sp) {
  const pks = peaksFor(sp, LEVEL);
  const tideKeys = pks.map((pk, i) => `<span><span class="sw" style="--c:${i === 0 ? "var(--sea)" : "var(--coast)"}"></span>${TX.idealTide}${sp.peaks.length > 1 ? " " + esc(pk.name) : ""}</span>`).join("");
  return `<div class="legend card">${tideKeys}
    <span><span class="sw bar"></span>${TX.legBar}</span>
    <span><span class="sw outline"></span>${TX.legOutline}</span>
    <span><span class="sw shade"></span>${TX.legShade}</span>
    <span><span class="sw nowl"></span>${TX.now}</span>
    <span><span class="sw ws" style="background:var(--good-tint)"></span>${TX.legGood}</span>
    <span><span class="sw ws" style="background:var(--warn-tint)"></span>${TX.legOk}</span>
    <span><span class="sw ws" style="background:var(--bad-tint)"></span>${TX.legBad}</span>
    ${compareFor(sp) ? `<span><span class="sw" style="--c:var(--ink)"></span>${TX.legCmp}</span>` : ""}
    <span>${TX.legTap}</span></div>`;
}
// Ideal wave height and energy for each level (columns), per peak; the level the page scores for is highlighted.
function idealTable(sp) {
  const head = `<thead><tr><td></td>${LEVELS.map(l => `<th scope="col" class="${l === LEVEL ? "on" : ""}">${esc(TX.lv[l])}</th>`).join("")}</tr></thead>`;
  const body = sp.peaks.map(pk => {
    const cells = (f, first) => LEVELS.map(l => {
      const V = pk.lv[l], on = l === LEVEL ? "on" : "";
      return V ? `<td class="${on}">${f(V)}</td>` : `<td class="${on} na">${first ? TX.notSuit : "–"}</td>`;
    }).join("");
    return (sp.peaks.length > 1 ? `<tr class="pkrow"><th scope="rowgroup">${esc(pk.name)}</th>${LEVELS.map(l => `<td class="${l === LEVEL ? "on" : ""}"></td>`).join("")}</tr>` : "")
      + `<tr><th scope="row">${TX.height}</th>${cells(V => `<b>${hgtText(V.hgt)}</b><small>${TX.rideRange(fmt(V.hgt.min, 1), fmt(V.hgt.max, 1))}</small>`, true)}</tr>`
      + `<tr><th scope="row">${TX.energyK}</th>${cells(V => `<b>${kjText(V.kj)}</b>`, false)}</tr>`;
  }).join("");
  return `<table class="itbl">${head}<tbody>${body}</tbody></table><p class="fine">${esc(TX.idealFine((pointOf(sp) || sp).name))}</p>`;
}
function renderSpot() {
  const sp = SPOTS.find(s => s.id === current), g = guideT(sp.id), el = $("panel");
  el.setAttribute("aria-labelledby", "tab-" + sp.id);
  WHY_OPEN = null;
  const rows = DATA ? scored(sp) : [];
  const focus = DATA ? focusRow(rows) : null;
  const mapUrl = `https://www.google.com/maps/search/?api=1&query=${sp.lat},${sp.lon}`;
  const linkIcon = t => /kamera|webcam/i.test(t) ? ICON_CAM : t === TX.map ? ICON_PIN : ICON_OUT;
  const links = [[TX.map, mapUrl], ...g.links].map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${linkIcon(t)}${esc(t)}</a>`).join("");
  const nowTxt = focus
    ? `<b>${esc(TX.fcAt(dayInline(focus.s.d), focus.s.t))}</b> ${esc(focus.wind.k === "glassy" ? TX.glassyTxt : TX.windTxt(focus.s.w, dn(focus.s.wd), wsLabel(focus.wind)))}, ${esc(TX.swellTxt(fmt(focus.s.h), dn(focus.s.sd)))}${focus.s.w > 5 ? ". " + TX.dashed : ""}`
    : TX.noFocus;
  const T = tidesOf(sp), pt = pointOf(sp);
  const days = DATA ? spotDays(sp).filter(d => d >= todayLocal()) : [];
  const station = pt && DATA && DATA.tideNames ? DATA.tideNames[pt.tides] : "";
  const tideSummary = sp.peaks.map(pk => (sp.peaks.length > 1 ? pk.name + ": " : "") + pkTide(sp, pk)).join(" · ");
  const tidePeaks = sp.peaks.map(pk => `<li><b>${esc(sp.peaks.length > 1 ? pk.name : TX.bestW)}:</b> ${esc(pkTide(sp, pk))}${days.length ? `<span class="wins"><span class="wl">${TX.idealDaylight}</span>${days.map(d => { const tw = tideWindows(pk, T, d); return `<span><b>${esc(dayShort(d))}</b> ${tw === "all" ? TX.allDay : tw.length ? tw.map(x => hm(x.a) + "–" + hm(x.b)).join(", ") : "–"}</span>`; }).join("")}</span>` : ""}</li>`).join("");
  let fc = "";
  if (!DATA) fc = `<p class="empty">${dbState === "loading" ? TX.loading : TX.fcNone}</p>`;
  else if (!slotsOf(sp).length) fc = `<p class="empty">${TX.fcNoSpot}</p>`;
  else if (!days.length) fc = `<p class="empty">${TX.fcExpired}</p>`;
  else {
    const maxV = Math.max(-1, ...rows.filter(r => !r.past && r.v != null).map(r => r.v));
    fc = days.map(d => {
      const l = dayLabel(d), s = sunEvents(d), dr = rows.filter(r => r.s.d === d), wins = windows(sp, d);
      // High and low waters of the day in one even row; the ones in the dark are dimmed.
      const ext = T.filter(e => e.d === d);
      const tides = ext.length ? `<div class="tides" style="--n:${ext.length}">${ext.map(e => `<div class="tcell ${e.k === "H" ? "hi" : "lo"}${e.ms < s.dawn || e.ms > s.dusk ? " night" : ""}"><span class="tk"><span class="tri" aria-hidden="true">${e.k === "H" ? "▲" : "▼"}</span>${e.k === "H" ? TX.hi : TX.lo}</span><b class="num">${esc(e.t)}</b></div>`).join("")}</div>` : "";
      const c = compareFor(sp);
      const cmp = c && c.days.includes(d) ? `<p class="cmp"><span class="lk">${ICON_CMP}${TX.compare}</span><span><b>mondo.surf:</b> ${esc(cmpText(c, d))}</span></p>` : "";
      return `<section class="day card" id="day-${dayId(d)}" aria-label="${esc(l.rel ? l.rel + ", " : "")}${esc(l.wd)}">
        <div class="dayhead"><h3>${l.rel ? `<span class="rel">${l.rel}</span>` : ""}${esc(l.wd)}</h3>
          <div class="daymeta"><span class="pill" title="${TX.sun(hm(s.rise), hm(s.set))}">${ICON_SUN}${TX.lightPill} <b class="num">${hm(s.dawn)}–${hm(s.dusk)}</b></span></div></div>
        ${tides}
        ${goBlock(sp, d)}
        ${cmp}
        ${tideChart(sp, d, dr, wins)}

      <div class="chips"><span class="chip">${esc(spType(sp))}</span><span class="chip">${esc(spLevel(sp))}</span></div>
      <div class="links">${links}</div>
    </div>
    <div class="ideal">
      <div class="iw"><span class="lk">${ICON_WAVE}${TX.idealHead}</span>${idealTable(sp)}</div>
      <div><span class="lk">${ICON_TIDE}${TX.bestTide}</span><b>${esc(tideSummary)}</b></div>
      <div><span class="lk">${ICON_SW}${TX.swellK}</span><b>${esc(g.swellText)}</b></div>
      <div><span class="lk">${ICON_WD}${TX.windK}</span><b>${esc(g.windText)} ${TX.offTag}</b></div>
    </div>
    ${DATA && days.length ? legendHtml(sp) : ""}
    <section aria-labelledby="h-fc"><h2 class="sect-h" id="h-fc">${TX.fcHead}</h2><div class="fc">${fc}</div></section>
    <section aria-labelledby="h-guide"><h2 class="sect-h" id="h-guide">${TX.guideHead}</h2>
      <div class="guide card">
        <figure class="site">
          <figcaption class="card-h">${TX.siteCap}</figcaption>
          ${diagram(sp, focus)}
          <ul class="dg-legend">
            <li>${ICON_SWELL}<span><b>${TX.idealSwell}</b> ${TX.comes} ${esc(g.swellText)}</span></li>
            <li>${ICON_WIND}<span><b>${TX.idealWind}</b> ${esc(g.windText)}, ${TX.offLand}</span></li>
            <li>${ICON_NOW}<span>${nowTxt}</span></li>
          </ul>
        </figure>
        <div class="facts">
          <div class="tidebox"><h3 class="card-h">${TX.tideboxH}</h3><ul>${tidePeaks}</ul><p class="fine">${esc((isEN() ? TIDE_NOTE_EN : TIDE_NOTE)[sp.id])}${station ? esc(TX.tideFor(station)) : ""}</p></div>
          <dl>${g.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        </div>
      </div>
    </section>`;
  el.onclick = e => {
    const b = e.target.closest("button.tcol");
    if (b) { showWhy(b.dataset.k, true); return; }
    const x = e.target.closest("[data-close]");
    if (x) {
      const box = x.closest(".why"); box.hidden = true; WHY_OPEN = null;
      box.closest(".day").querySelectorAll("button.tcol.sel").forEach(t => { t.classList.remove("sel"); t.setAttribute("aria-expanded", "false"); });
    }
  };
}

function renderAll() { CACHE = {}; renderMeta(); renderBest(); renderMatrix(); renderTabs(); renderSpot(); }

// ---------- Language switch ----------
// Static text in the page is marked with data-i18n (inner HTML) or data-i18n-aria (aria-label).
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = TX.st[el.dataset.i18n]; if (v != null) el.innerHTML = v; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { const v = TX.st[el.dataset.i18nAria]; if (v != null) el.setAttribute("aria-label", v); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}
function setLang(l) {
  if (!LANGS.includes(l) || l === LANG) return;
  LANG = l; TX = STR[l];
  try { localStorage.setItem("ns_lang", l); } catch (e) {}
  applyLang(); renderAll();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

// The forecast ships inside the page, so it works for anyone with the link, signed in or not.
// The data comes from data/forecast.json, which a GitHub Action refreshes after each surf-forecast update.
const EMBEDDED = /*DATA*/null;
function setData(d) {
  DATA = d; CACHE = {};
  const sets = Array.isArray(d.tides) ? {corralejo: d.tides} : (d.tides || {}); // schema 2 had one tide list and one point
  const T = Object.fromEntries(Object.entries(sets).map(([k, v]) => [k, prepTides(v)]));
  const pts = d.points || {majanicho: {name: "Majanicho", tides: "corralejo", slots: d.slots}};
  POINTS = {};
  for (const [k, p] of Object.entries(pts)) POINTS[k] = {id: k, name: p.name || k, url: p.url || "", tides: p.tides, S: prepSlots(validSlots(p.slots)), T: T[p.tides] || Object.values(T)[0] || []};
  dbState = "ok";
}
if (EMBEDDED && (EMBEDDED.points || Array.isArray(EMBEDDED.slots))) setData(EMBEDDED); else dbState = "loading";
// Load the forecast file now and again every 15 minutes, so an open page picks up new runs.
let lastIssued = null;
function loadData() {
  return fetch("data/forecast.json?t=" + Date.now(), {cache: "no-store"})
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(d => {
      if (!d || !(d.points || Array.isArray(d.slots))) { if (!DATA) { dbState = "empty"; renderAll(); } return; }
      const key = d.updatedAt + "|" + d.issued;
      if (key === lastIssued) return;
      lastIssued = key; setData(d); renderAll();
    })
    .catch(() => { if (!DATA) { dbState = "error"; renderAll(); } });
}
loadData();
setInterval(loadData, 15 * 60000);
applyLang();
renderAll();
// Keep "teď", past slots and the best windows current while the page stays open.
setInterval(() => {
  if (!DATA) return;
  CACHE = {}; renderMeta(); renderBest(); renderMatrix();
  if (!document.querySelector("#panel details[open]")) renderSpot();
}, 10 * 60000);


// Hero decoration: slow swell lines ("corduroy") drawn on a canvas. Static under reduced motion, paused when off screen.
(function swellLines() {
  const cv = document.getElementById("swell");
  if (!cv || typeof cv.getContext !== "function") return;
  const ctx = cv.getContext("2d"); if (!ctx) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, raf = 0, visible = true; const t0 = performance.now();
  function size() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    w = r.width; h = r.height; cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function draw(now) {
    const t = (now - t0) / 1000; ctx.clearRect(0, 0, w, h);
    const n = 12;
    for (let i = 0; i < n; i++) {
      const y0 = h * (0.12 + i * 0.075), amp = 3 + i * 0.85, k = 0.011 - i * 0.00035, sp = 0.28 + i * 0.025;
      ctx.beginPath();
      for (let x = -12; x <= w + 12; x += 8) {
        const y = y0 + Math.sin(x * k + t * sp + i * 0.7) * amp + Math.sin(x * k * 0.37 - t * sp * 0.55 + i * 1.3) * amp * 0.55;
        if (x === -12) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(255,255,255,${(0.05 + i * 0.014).toFixed(3)})`;
      ctx.lineWidth = 1 + i * 0.09; ctx.stroke();
    }
    if (!reduce && visible && !document.hidden) raf = requestAnimationFrame(draw);
  }
  size(); draw(performance.now());
  if (typeof ResizeObserver === "function") new ResizeObserver(() => { size(); if (reduce) draw(performance.now()); }).observe(cv);
  if (!reduce && typeof IntersectionObserver === "function") new IntersectionObserver(es => {
    visible = es[0].isIntersecting; cancelAnimationFrame(raf); if (visible) raf = requestAnimationFrame(draw);
  }).observe(cv);
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden && !reduce && visible) raf = requestAnimationFrame(draw); });
})();
